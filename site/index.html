<meta charset="utf-8">
<title>Lynx Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Lausanne Lynx Library — navy, Lausanne blue, gold. Layout: a field-notebook library. Home = picture-card shelf with filters; topic = one long readable page. */
:root{
  --paper:#f3f6f9; --card:#ffffff; --ink:#14233a; --soft:#56657a; --line:#d6dee8;
  --brand:#00274c; --brand-soft:#e3eaf3; --sky:#017ea7; --sky-soft:#dff1f7;
  --sun:#ffcb05; --sun-soft:#fff4c7; --berry:#ca1639; --berry-soft:#fbe3e8;
  --shadow:0 2px 0 rgba(0,39,76,.08), 0 8px 24px -12px rgba(0,39,76,.3);
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0b1626; --card:#13233a; --ink:#eef3f8; --soft:#a5b3c5; --line:#24364f;
  --brand:#ffcb05; --brand-soft:#1c2f4a; --sky:#4fc0e6; --sky-soft:#12344a;
  --sun:#ffcb05; --sun-soft:#3a3214; --berry:#f0738d; --berry-soft:#3d1a24;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b1626; --card:#13233a; --ink:#eef3f8; --soft:#a5b3c5; --line:#24364f;
  --brand:#ffcb05; --brand-soft:#1c2f4a; --sky:#4fc0e6; --sky-soft:#12344a;
  --sun:#ffcb05; --sun-soft:#3a3214; --berry:#f0738d; --berry-soft:#3d1a24;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.15rem;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:20px 64px}
a{color:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--brand);display:flex;align-items:center;gap:8px}
.brand svg{width:40px;height:40px;flex:none}
.brand span{display:grid;line-height:1.1}
.brand small{font-family:var(--body);font-weight:700;font-size:.75rem;color:var(--soft);letter-spacing:.02em}
.bar .spacer{flex:1}
.pill-btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-weight:700;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.pill-btn svg{width:20px;height:20px;flex:none}
.pill-btn:hover{border-color:var(--brand)}

/* home */
.hero{display:grid;gap:10px;margin-block:8px 22px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800}
.hero h1 span{color:var(--sky)}
.hero p{margin:0;color:var(--soft);max-width:52ch}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 14px;max-width:560px}
.search:focus-within{border-color:var(--brand)}
.search svg{width:26px;height:26px;flex:none;color:var(--soft)}
.search input{border:0;background:transparent;font:inherit;font-size:1.3rem;color:var(--ink);width:100%;min-width:0;outline:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px 22px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700;font-size:1rem}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);border:2px solid transparent;transition:transform .15s}
.tcard:hover{transform:translateY(-3px);border-color:var(--brand)}
.tcard img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--brand-soft);display:block}
.tcard .nm{font-family:var(--display);font-weight:800;font-size:1.3rem;padding:10px 12px 2px}
.tcard .meta{font-size:.9rem;color:var(--soft);padding:0 12px 12px}
.empty{color:var(--soft);padding:24px 0}
.count{color:var(--soft);font-size:.95rem;margin:-8px 0 12px}

/* topic page */
.thead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.thead img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:22px;box-shadow:var(--shadow);background:var(--brand-soft)}
.thead h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:800;color:var(--brand)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-block:10px}
.tag{font-size:.9rem;font-weight:700;padding:2px 12px;border-radius:999px;background:var(--sky-soft);color:var(--sky)}
.tag.hab{background:var(--sun-soft);color:var(--ink)}
.intro{font-size:1.45rem;line-height:1.5;margin:6px 0 14px}
.read{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--sun);color:#1f2b24;font-weight:700;border-radius:999px;padding:8px 18px;font-size:1.05rem}
.read svg{width:22px;height:22px}
.read.small{padding:4px 12px;font-size:.9rem;background:var(--sun-soft);color:var(--ink)}
.read.small svg{width:18px;height:18px}
.read[aria-pressed="true"]{background:var(--berry);color:#fff}

.jump{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:18px;border-bottom:2px dashed var(--line)}
.jump a{font-size:.95rem;font-weight:700;text-decoration:none;padding:4px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.facts{display:grid;gap:22px}
.fact{background:var(--card);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow)}
.fact-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.fact h2{font-size:1.55rem;font-weight:800;flex:1;min-width:0}
.fact ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.fact li{max-width:60ch}
.fact li::marker{color:var(--brand)}
.s.on{background:var(--sun-soft);box-shadow:0 0 0 4px var(--sun-soft);border-radius:4px}
.from{margin-top:14px;padding-top:12px;border-top:2px dotted var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.95rem}
.from b{color:var(--soft);font-weight:700}
.src-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--sky-soft);border-radius:999px;padding:2px 12px 2px 4px;font-weight:700}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sky);color:var(--paper);font-size:.8rem;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.num.vid{background:var(--berry)}

.side{display:grid;gap:22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.box{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.box h2{font-size:1.3rem;font-weight:800;margin-bottom:10px}
.vocab{display:grid;gap:10px;margin:0}
.vocab div{background:var(--brand-soft);border-radius:12px;padding:8px 12px}
.vocab dt{font-weight:700;color:var(--brand);font-size:1.15rem}
.vocab dd{margin:0;font-size:1rem}

h2.big{font-size:1.9rem;font-weight:800;margin:44px 0 6px;color:var(--ink)}
.sub{color:var(--soft);margin:0 0 16px}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
.photos figure{margin:0;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.photos figcaption{padding:10px 14px;font-size:.95rem}
.credit{display:block;color:var(--soft);font-size:.8rem;margin-top:2px}
.credit a{color:var(--soft)}

.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.vcard{display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:2px solid transparent}
.vcard:hover{border-color:var(--berry)}
.vthumb{position:relative;aspect-ratio:16/9;background:var(--berry-soft)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:68px;height:68px;border-radius:50%;background:var(--berry);display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.play svg{width:30px;height:30px;color:#fff;margin-left:4px}
.vbody{padding:12px 16px 16px;display:grid;gap:4px}
.vbody .t{font-weight:700;font-size:1.1rem;display:flex;gap:8px;align-items:flex-start}
.vbody .c{color:var(--soft);font-size:.95rem}

.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.book{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:2px solid transparent}
.book:hover{border-color:var(--sun)}
.spine{grid-row:span 4;width:44px;height:60px;border-radius:4px 8px 8px 4px;background:var(--brand);display:grid;place-items:center;color:var(--sun);box-shadow:inset 6px 0 0 rgba(0,0,0,.18)}
.spine svg{width:22px;height:22px}
.book .t{font-weight:700;font-size:1.1rem;line-height:1.3}
.book .a{color:var(--soft);font-size:.95rem}
.book .lv{display:flex;gap:6px;flex-wrap:wrap}
.num.book-n{background:var(--sun);color:#14233a}
.epic-more{display:inline-flex;margin-top:14px}

.sources{display:grid;gap:14px;counter-reset:s}
.source{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;scroll-margin-top:20px}
.source:target{outline:4px solid var(--sun)}
.source .num{width:34px;height:34px;font-size:1rem;grid-row:span 3}
.source h3{font-family:var(--body);font-size:1.2rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.source h3 a{color:var(--ink)}
.lvl{font-family:var(--body);font-size:.8rem;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.lvl.together{background:var(--sun-soft);color:var(--ink)}
.source p{margin:0}
.site{color:var(--soft);font-size:.95rem}
.cite{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:6px 10px;font-size:.95rem}
.cite code{font-family:var(--body);flex:1;min-width:0;user-select:all}
.copy{border:0;background:var(--brand);color:var(--paper);font-weight:700;border-radius:8px;padding:2px 12px;font-size:.85rem}

.helper{margin-top:20px;background:var(--brand-soft);border-radius:18px;padding:16px 20px}
.helper h3{font-size:1.25rem;color:var(--brand);margin-bottom:6px}
.helper p{margin:4px 0}
.blank{display:inline-block;min-width:8ch;border-bottom:2px solid var(--brand)}
.note{font-size:.95rem;color:var(--soft);margin-top:32px}

@media (max-width:820px){
  .thead,.cols{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
}
@media (prefers-reduced-motion:reduce){.tcard{transition:none}.tcard:hover{transform:none}}
</style>

<script src="settings-config.js"></script>
<div class="wrap">
  <nav class="bar">
    <a class="brand" href="#">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--brand)"/><path d="M9 9l2 11h18l2-11-7 6h-8z" fill="var(--sun)"/><path d="M9 9V5M31 9V5" stroke="var(--sun)" stroke-width="2" stroke-linecap="round"/><ellipse cx="20" cy="23" rx="10" ry="9" fill="var(--sun)"/><circle cx="16" cy="21" r="1.6" fill="var(--brand)"/><circle cx="24" cy="21" r="1.6" fill="var(--brand)"/><path d="M18.5 25h3l-1.5 1.6z" fill="var(--brand)"/><path d="M10 26l-4 1M10 28l-4 2M30 26l4 1M30 28l4 2" stroke="var(--sun)" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Lynx Library<small>Lausanne First Grade Research</small></span>
    </a>
    <span class="spacer"></span>
    <a class="pill-btn" id="homeBtn" href="#" hidden>All topics</a>
  </nav>
  <main id="app"><p class="empty">Loading…</p></main>
</div>

<script>
const ICON = {
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  stop:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>',
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>'
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = document.getElementById('app');
let TOPICS = [], filter = 'all', query = '', currentTopic = null;

/* ---------- read aloud: recorded natural voice, device voice as backup ---------- */
const canSpeak = true;
const player = new Audio();
let speakingBtn = null, queue = [], current = null;
const hasTTS = 'speechSynthesis' in window;
function bestVoice(){
  const vs = hasTTS ? speechSynthesis.getVoices().filter(v => /^en[-_](US|GB|AU|CA)/i.test(v.lang)) : [];
  const rank = v => (/premium|neural|natural|enhanced/i.test(v.name) ? 0 : /google|microsoft (aria|jenny|guy)/i.test(v.name) ? 1 : /samantha|ava|allison|karen|daniel/i.test(v.name) ? 2 : 3) + (/en[-_]US/i.test(v.lang) ? 0 : .5);
  return vs.sort((a, b) => rank(a) - rank(b))[0];
}
function stopSpeaking(){
  queue = []; current = null;
  player.onended = player.onerror = null; player.pause();
  if (hasTTS) speechSynthesis.cancel();
  document.querySelectorAll('.s.on').forEach(e => e.classList.remove('on'));
  if (speakingBtn){ speakingBtn.setAttribute('aria-pressed','false'); speakingBtn.innerHTML = speakingBtn.dataset.label; speakingBtn = null; }
}
function highlight(el){
  document.querySelectorAll('.s.on').forEach(e => e.classList.remove('on'));
  el.classList.add('on');
  const r = el.getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) el.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
function next(){
  const btn = speakingBtn;
  if (!queue.length){ stopSpeaking(); return; }
  const el = queue.shift(); current = el; highlight(el);
  const file = currentTopic?.audio?.[el.textContent];
  const fallback = () => {
    if (!hasTTS || speakingBtn !== btn){ if (speakingBtn === btn) next(); return; }
    const u = new SpeechSynthesisUtterance(el.textContent);
    const v = bestVoice(); if (v) u.voice = v;
    u.rate = .9; u.pitch = 1;
    u.onend = () => { if (speakingBtn === btn) setTimeout(next, 250); };
    speechSynthesis.speak(u);
  };
  if (!file){ fallback(); return; }
  player.src = 'audio/' + file;
  player.onended = () => { if (speakingBtn === btn) setTimeout(next, 280); };
  player.onerror = () => { player.onerror = null; fallback(); };
  player.play().catch(fallback);
}
function speakEls(els, btn){
  if (speakingBtn === btn){ stopSpeaking(); return; }
  stopSpeaking();
  speakingBtn = btn; btn.dataset.label = btn.innerHTML;
  btn.setAttribute('aria-pressed','true'); btn.innerHTML = ICON.stop + ' Stop';
  queue = [...els]; next();
}
if (hasTTS) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('[data-read]'); if (!b) return;
  const scope = b.dataset.read === 'all' ? app : document.getElementById(b.dataset.read);
  speakEls([...scope.querySelectorAll('.s')], b);
});
const readBtn = (target, label, small) => canSpeak ? `<button class="read${small?' small':''}" data-read="${target}" aria-pressed="false">${ICON.speak} ${label}</button>` : '';

/* ---------- copy citation ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('.copy'); if (!b) return;
  const code = b.parentElement.querySelector('code');
  const done = () => { b.textContent = 'Copied!'; setTimeout(() => b.textContent = 'Copy', 1500); };
  navigator.clipboard?.writeText(code.textContent).then(done, () => {
    const r = document.createRange(); r.selectNodeContents(code);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }) ?? (() => {})();
});

/* ---------- home ---------- */
function renderHome(){
  document.getElementById('homeBtn').hidden = true;
  document.title = 'Lynx Library';
  const habitats = [...new Set(TOPICS.map(t => t.habitat))].sort();
  const chips = [['all','Everything'],['animal','Animals'],['plant','Plants'], ...habitats.map(h => ['h:'+h, h])];
  app.innerHTML = `
    <header class="hero">
      <h1>What do you want to <span>learn about?</span></h1>
      <p>Pick an animal or a plant. You will find facts, pictures, videos, and books and websites to use for your research.</p>
    </header>
    <label class="search">${ICON.search}<input id="q" type="search" placeholder="Type a name, like frog" autocomplete="off" aria-label="Search topics" value="${esc(query)}"></label>
    <div class="filters" role="group" aria-label="Show">${chips.map(([k,l]) => `<button class="chip" data-f="${esc(k)}" aria-pressed="${filter===k}">${esc(l)}</button>`).join('')}</div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>`;
  const q = document.getElementById('q');
  q.addEventListener('input', () => { query = q.value; drawGrid(); });
  app.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    filter = c.dataset.f;
    app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
    drawGrid();
  }));
  drawGrid();
}
function drawGrid(){
  const ql = query.trim().toLowerCase();
  const list = TOPICS.filter(t =>
    (filter === 'all' || t.kind === filter || filter === 'h:' + t.habitat) &&
    (!ql || (t.name + ' ' + t.group + ' ' + t.habitat).toLowerCase().includes(ql)));
  document.getElementById('count').textContent = `${list.length} topic${list.length === 1 ? '' : 's'}`;
  document.getElementById('grid').innerHTML = list.length ? list.map(t => `
    <a class="tcard" href="#${t.slug}">
      <img src="images/${esc(t.photos[0]?.file)}" alt="" loading="lazy">
      <span class="nm">${esc(t.name)}</span>
      <span class="meta">${esc(t.group)} · ${esc(t.habitat)}</span>
    </a>`).join('') : `<p class="empty">No topics match “${esc(query)}”. Try a different word.</p>`;
}

/* ---------- topic ---------- */
function renderTopic(t){
  currentTopic = t;
  document.getElementById('homeBtn').hidden = false;
  document.title = t.name + ' · Lynx Library';
  const sentences = arr => arr.map(s => `<li><span class="s">${esc(s)}</span></li>`).join('');
  const fromChips = sec => {
    const s = (sec.from || []).filter(i => t.sources[i]).map(i =>
      `<a class="src-link" href="#${t.slug}~src${i}"><span class="num">${i+1}</span>${esc(t.sources[i].site)}</a>`);
    const v = (sec.fromVideos || []).filter(i => t.videos[i]).map(i =>
      `<a class="src-link" href="#${t.slug}~vid${i}"><span class="num vid">V${i+1}</span>Video: ${esc(t.videos[i].channel)}</a>`);
    return s.length + v.length ? `<div class="from"><b>I learned this from:</b>${[...s, ...v].join('')}</div>` : '';
  };
  app.innerHTML = `
    <article>
      <header class="thead">
        <div>
          <h1>${esc(t.name)}</h1>
          <div class="tags"><span class="tag">${t.kind === 'plant' ? 'Plant' : 'Animal'} · ${esc(t.group)}</span><span class="tag hab">${t.kind === 'plant' ? 'Grows in' : 'Lives in'}: ${esc(t.habitat)}</span></div>
          <p class="intro" id="intro"><span class="s">${esc(t.intro)}</span></p>
          ${readBtn('all', 'Read the whole page to me')}
        </div>
        <img src="images/${esc(t.photos[0]?.file)}" alt="${esc(t.photos[0]?.alt)}">
      </header>
      <nav class="jump" aria-label="Jump to">

      <div class="helper">

        <p>At the end of my paper I can list my sources. I copy the words from the dashed boxes.</p>
      </div>
      <p class="note">Facts on this page were written for first graders using the sources above. Photos are from Wikimedia Commons and are shared under the license shown.</p>
    </article>`;
}

/* ---------- routing: #slug or #slug~section ---------- */
function route(){
  stopSpeaking();
  const [slug, part] = decodeURIComponent(location.hash.slice(1)).split('~');
  const t = TOPICS.find(x => x.slug === slug);
  if (!t){ app.dataset.slug = ''; renderHome(); window.scrollTo(0, 0); return; }
  if (app.dataset.slug !== slug){ renderTopic(t); app.dataset.slug = slug; window.scrollTo(0, 0); }
  if (part){
    const id = part.startsWith('src') || part.startsWith('vid') ? (part.startsWith('vid') ? 'v' + part.replace('vid','src') : part) : 'sec-' + part;
    const el = document.getElementById(id);
    if (el) setTimeout(() => { el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); el.style.outline = '4px solid var(--sun)'; setTimeout(() => el.style.outline = '', 1600); }, 60);
  }
}
window.addEventListener('hashchange', () => { if (!location.hash) app.dataset.slug = ''; route(); });
document.getElementById('homeBtn').addEventListener('click', () => { app.dataset.slug = ''; });

/* Teachers hide topics on the Lynx Library settings server (see admin-server/). Anyone can read the list. */
async function loadHidden(){
  const base = (window.LYNX_SETTINGS_URL || '').replace(/\/$/, '');
  let cached = [];
  try { cached = JSON.parse(localStorage.getItem('lynx-hidden') || '[]'); } catch {}
  if (!base) return [];
  try {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch(base + '/api/visibility', {signal: ctl.signal, cache: 'no-store'});
    clearTimeout(timer);
    if (!r.ok) return cached;
    const hidden = (await r.json()).hidden || [];
    try { localStorage.setItem('lynx-hidden', JSON.stringify(hidden)); } catch {}
    return hidden;
  } catch { return cached; }
}

Promise.all([fetch('topics.json').then(r => r.json()), loadHidden()]).then(([d, hidden]) => {
  TOPICS = d.filter(t => !hidden.includes(t.slug)).sort((a, b) => a.name.localeCompare(b.name));
  route();
}).catch(() => { app.innerHTML = '<p class="empty">The topics could not load. Please refresh the page.</p>'; });
</script>
